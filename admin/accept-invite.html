<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ตั้งรหัสผ่าน — ครกแดง แอดมิน</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card" id="authCard">
      <h1 class="auth-title">ตั้งรหัสผ่าน</h1>
      <p class="auth-subtitle" id="modeSubtitle">กำลังตรวจสอบลิงก์เชิญ...</p>
      <p class="auth-error hidden" id="formError"></p>

      <form id="acceptForm" style="display:none;">
        <div class="form-row">
          <label class="form-label">อีเมล</label>
          <input type="email" id="emailDisplay" class="text-input" disabled />
        </div>
        <div class="form-row">
          <label class="form-label">ชื่อ</label>
          <input type="text" id="nameInput" class="text-input" />
        </div>
        <div class="form-row">
          <label class="form-label">ตั้งรหัสผ่าน (อย่างน้อย 8 ตัวอักษร)</label>
          <input type="password" id="passwordInput" class="text-input" required minlength="8" />
        </div>
        <button type="submit" class="btn btn-primary btn-wide" id="submitBtn">สร้างบัญชี</button>
      </form>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="accept-invite.js"></script>
</body>
</html>
